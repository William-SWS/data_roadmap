<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Full Stack AI Roadmap — Complete Study Path</title>
  <meta name="description" content="A comprehensive, free roadmap to become a Full Stack AI professional. 130+ topics, 600+ curated free resources, 9 project checkpoints. Covers Data Analysis, Machine Learning, Deep Learning, LLMs, MLOps and more.">
  <meta property="og:title" content="Full Stack AI Roadmap">
  <meta property="og:description" content="9 phases, 130+ topics, 600+ free resources — from Python fundamentals to production AI systems.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#07090c">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header id="site-header">
    <div class="header-inner">
      <div class="header-left">
        <div class="logo">
          <span class="logo-icon">🧠</span>
          <div>
            <h1 class="logo-title">Full Stack AI Roadmap</h1>
            <p class="logo-subtitle">From zero to production AI — all free resources</p>
          </div>
        </div>
      </div>
      <div class="header-right">
        <div class="header-stats">
          <span id="stats-completed">0</span> / <span id="stats-total">0</span> completed
        </div>
        <button id="reset-btn" class="btn-reset" title="Reset all progress">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
        </button>
      </div>
    </div>
    <div id="progress-bar-container">
      <div id="progress-bar"></div>
    </div>
  </header>

  <!-- Search -->
  <div id="search-container">
    <div class="search-inner">
      <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      <input type="text" id="search-input" placeholder="Search topics, resources..." autocomplete="off">
      <span id="search-count" class="search-count"></span>
    </div>
  </div>

  <div class="layout">
    <!-- Phase Navigation (Sidebar) -->
    <nav id="phase-nav">
      <div class="nav-inner">
        <!-- Populated by app.js -->
      </div>
    </nav>

    <!-- Main Content -->
    <main id="roadmap-content">
      <!-- Populated by app.js -->
    </main>
  </div>

  <!-- Footer -->
  <footer id="site-footer">
    <p>Built with 🤖 — A free, open study roadmap covering
      <a href="https://roadmap.sh/data-analyst" target="_blank">Data Analyst</a>,
      <a href="https://roadmap.sh/machine-learning" target="_blank">Machine Learning</a>,
      <a href="https://roadmap.sh/power-bi" target="_blank">Power BI</a>,
      <a href="https://roadmap.sh/ai-data-scientist" target="_blank">AI Data Scientist</a>,
      <a href="https://roadmap.sh/data-engineer" target="_blank">Data Engineer</a>, and
      <a href="https://roadmap.sh/ai-engineer" target="_blank">AI Engineer</a> paths.
    </p>
    <p class="footer-sub">Progress saved locally in your browser.</p>
  </footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
